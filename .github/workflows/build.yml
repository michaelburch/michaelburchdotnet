name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # External links rot on their own schedule, not ours.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/blog

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin zola
        env:
          ZOLA_VERSION: 0.23.4

      - run: zola build

      # Internal links only: a PR should not fail because someone else's site
      # started returning 403 to non-browser user agents.
      - name: Check internal links
        run: zola check --skip-external-links

      - name: Check external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: zola check

  image:
    needs: check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The cluster runs 6 arm64 workers alongside 3 amd64 servers, so a
      # single-arch image would be unschedulable on most nodes.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  purge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Skipped until the secrets exist, so the workflow is usable before the
      # Cloudflare zone is set up.
      - name: Purge Cloudflare cache
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID not set; skipping."
            exit 0
          fi
          curl -sSf -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
