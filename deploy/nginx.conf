# Cache policy lives here rather than in a CDN's dashboard, so the edge can be
# swapped without recreating rules. s-maxage applies to shared caches only;
# browsers revalidate HTML every time. stale-if-error keeps the site up while
# the origin is unreachable on any CDN that honours it.
map $sent_http_content_type $cache_control {
    default                          "public, max-age=0, s-maxage=600, stale-while-revalidate=86400, stale-if-error=604800";
    ~*^text/css                      "public, max-age=31536000, immutable";
    ~*javascript                     "public, max-age=31536000, immutable";
    ~*^image/                        "public, max-age=2592000";
    ~*^font/                         "public, max-age=2592000";
    ~*application/json               "public, max-age=3600";
    ~*xml                            "public, max-age=0, s-maxage=3600";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare terminates TLS and caches; these headers are what the edge sees.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSS and JS carry a ?h= content hash, so they are safe to pin indefinitely.
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/rss+xml application/atom+xml image/svg+xml;

    # Legacy Statiq pagination URLs.
    location ~ ^/page/(\d+)\.html$ {
        return 301 /page/$1/;
    }

    # Retired e-mail subscription page.
    location ~ ^/subscribe(\.html|/)?$ {
        return 301 /;
    }

    # Zola slugifies the dot, so this tag moved.
    location ~ ^/tags/asp\.net/?$ {
        return 301 /tags/asp-net/;
    }

    location = /feed/index.rss {
        types { }
        default_type application/rss+xml;
    }

    # Empty types block clears the .xml mapping so default_type applies.
    location = /feed/index.xml {
        types { }
        default_type application/atom+xml;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    location = /search_index.en.json {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
