# The only Cloudflare-specific artifact in the repo. Deleting this file and
# repointing DNS is the whole exit path; blog.yaml and ingress.yaml stay as they
# are, because the tunnel forwards to the haproxy ingress rather than to the
# blog Service directly. Configure the public hostname in the Zero Trust
# dashboard to point at:
#   http://haproxy-ingress-kubernetes-ingress.haproxy.svc.cluster.local:80
#
# The tunnel dials out to Cloudflare, so the cluster needs no inbound ports and
# the origin IP is never published. Create the secret out-of-band:
#   kubectl -n michaelburch create secret generic cloudflared-token \
#     --from-literal=token='<token from the Cloudflare Zero Trust dashboard>'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: michaelburch
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
