# The only Cloudflare-specific artifact in the repo. Deleting this file and
# repointing DNS is the whole exit path; blog.yaml and ingress.yaml stay as they
# are, because the tunnel forwards to the haproxy ingress rather than to the
# blog Service directly. Configure the public hostname in the Zero Trust
# dashboard to point at:
#   http://haproxy-ingress-kubernetes-ingress.haproxy.svc.cluster.local:80
#
# The tunnel dials out to Cloudflare, so the cluster needs no inbound ports and
# the origin IP is never published. Create the secret out-of-band:
#   kubectl -n michaelburch create secret generic cloudflared-token \
#     --from-literal=token='<token from the Cloudflare Zero Trust dashboard>'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: michaelburch
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          ports:
            - name: metrics
              containerPort: 2000
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/creds
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: cloudflared-credentials
---
# Routing lives here rather than in Cloudflare's remote config, so the rules are
# reviewable and the tunnel can be rebuilt without dashboard state.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: michaelburch
data:
  config.yaml: |
    tunnel: 65e0dca1-96cf-4c42-a87c-82687178be90
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: www.michaelburch.net
        service: http://haproxy-ingress-kubernetes-ingress.haproxy.svc.cluster.local:80
      - hostname: michaelburch.net
        service: http://haproxy-ingress-kubernetes-ingress.haproxy.svc.cluster.local:80
      - service: http_status:404
