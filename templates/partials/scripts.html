<script defer src="{{ get_url(path='assets/js/main.js', cachebust=true) }}"></script>
<script defer src="{{ get_url(path='assets/js/reftagger.min.js') }}"></script>
<script defer>
  var mq = window.matchMedia("(prefers-color-scheme: light)");
  window.refTagger = {
    settings: {
      bibleVersion: "HCSB",
      socialSharing: ["faithlife", "twitter", "facebook"],
      tooltipStyle: mq.matches ? "dark" : "light",
      customStyle: {
        heading: {
          // Reftagger colour-validates heading.backgroundColor and
          // body.moreLink.color whenever customStyle is set, warning on the
          // console if they are absent, so both are given explicitly.
          backgroundColor: "#ffffff",
          color: "#646464",
          fontFamily: "Verdana, Geneva, sans-serif"
        },
        body: {
          color: "#646464",
          fontFamily: "Verdana, Geneva, sans-serif",
          moreLink: {
            color: "#3f75a2"
          }
        }
      }
    }
  };
</script>
