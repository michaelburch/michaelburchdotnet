<header id="header">
  <div class="inner">
    <h1><a href="{{ get_url(path='/') }}"><img class="avatar" src="{{ get_url(path=config.extra.author_image) }}" alt="" />{{ config.author }}</a></h1>
    {#- Grouped so a narrow bar wraps the links and the buttons together. #}
    <div class="header-nav">
      <nav class="links">
        <ul>
          {%- include "partials/links.html" -%}
        </ul>
      </nav>
      <nav class="tools">
        <button type="button" id="search-toggle" class="icon-search" aria-controls="search-bar" aria-expanded="false" aria-label="Search"></button>
        <button type="button" id="theme-toggle" aria-label="Switch between light and dark">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" />
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1" />
            </g>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 1 0 11 11z" fill="currentColor" />
          </svg>
        </button>
      </nav>
    </div>
  </div>
  <form id="search-bar" method="get" action="{{ get_url(path='/search/') }}" hidden>
    <div class="inner">
      <input type="search" name="query" placeholder="Search" aria-label="Search" />
    </div>
  </form>
</header>
