base_url = "https://www.michaelburch.net"
title = "Michael Burch's Blog"
description = "Michael Burch is a technologist, programmer, runner, hiker, husband, father and more."
default_language = "en"
author = "Michael Burch"

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["feed/index.xml", "feed/rss.xml"]
minify_html = true

taxonomies = [
    { name = "tags", feed = false, paginate_by = 10, render = true },
]

[markdown]
smart_punctuation = false
external_links_target_blank = true
external_links_no_follow = false
render_emoji = false

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_date = true
include_path = true
include_content = true

[link_checker]
# These reject bots rather than being genuinely broken.
skip_prefixes = [
    "https://linkedin.com",
    "https://www.alltrails.com",
    "https://smile.amazon.com",
    "https://michaelburch.us19.list-manage.com",
    "https://www.strava.com",
]
skip_anchor_prefixes = ["https://github.com/"]

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
intro = "Tech Enthusiast, Runner, Blogger"
author_email = "me@michaelburch.net"
author_image = "/images/profile-github.jpg"
author_bio = "Michael Burch is a technology professional focused on digital sovereignty"
bluesky_user = "michaelburch.net"
default_card = "/images/ogcard.jpeg"
posts_per_page = 4
design_credit_url = "https://html5up.net"
design_credit_name = "HTML5Up"

keywords = [
    "Michael Burch", "Michael", "Burch", "Azure", "Cloud", "Rust", "dotnet", ".NET",
    "C#", "Python", "michaelburch", "Round Rock", "Texas", "Austin", "ATX",
]

